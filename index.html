<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZeroQR Studio — Özgür & Modern QR Oluşturucu</title>
  <script src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(22, 30, 49, 0.7);
      --border: rgba(255, 255, 255, 0.1);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0ea5e9;
      --danger: #ef4444;
      --danger-hover: #dc2626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.15) 0px, transparent 50%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 950px;
      display: grid;
      grid-template-columns: 1fr 300px; /* Sağ taraf sabit 300px, sol esnek */
      gap: 2.5rem;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 3rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    @media (max-width: 850px) {
      .container {
        grid-template-columns: 1fr;
        padding: 2rem;
      }
    }

    .header-group {
      grid-column: 1 / -1;
      text-align: center;
      margin-bottom: 1rem;
    }

    .header-group h1 {
      font-size: 2.2rem;
      font-weight: 800;
      background: linear-gradient(to right, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -1px;
    }

    .header-group p {
      color: var(--text-muted);
      font-size: 1rem;
      margin-top: 0.5rem;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
    }

    .form-panel {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    label {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    input[type="text"], select {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.9rem 1.2rem;
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }

    .color-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.2rem;
    }

    .color-input-wrapper {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.6rem 1rem;
    }

    input[type="color"] {
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: transparent;
      cursor: pointer;
      padding: 0;
    }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: none; border-radius: 6px; }

    /* YENİ: Logo Yükleme Alanı */
    .logo-upload-area {
      position: relative;
      border: 2px dashed var(--border);
      border-radius: 16px;
      padding: 2rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: rgba(15, 23, 42, 0.4);
    }

    .logo-upload-area:hover, .logo-upload-area.drag-over {
      border-color: var(--primary);
      background: rgba(56, 189, 248, 0.05);
    }

    .upload-prompt {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.8rem;
      color: var(--text-muted);
    }

    .upload-prompt svg {
      width: 40px;
      height: 40px;
      stroke: var(--text-muted);
      transition: stroke 0.2s;
    }
    .logo-upload-area:hover .upload-prompt svg { stroke: var(--primary); }

    .upload-text { font-size: 0.9rem; font-weight: 500; }
    .upload-subtext { font-size: 0.8rem; opacity: 0.7; }

    #logo-input {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      opacity: 0;
      cursor: pointer;
    }

    /* YENİ: Logo Önizleme ve Kaldırma */
    .logo-preview-wrapper {
      display: none; /* Varsayılan gizli */
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.75rem 1rem;
    }

    .logo-preview-wrapper.active { display: flex; }

    .logo-meta { display: flex; align-items: center; gap: 0.75rem; }
    #logo-preview-img {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      object-fit: contain;
      background: #fff; /* Şeffaf logolar görünsün diye */
      padding: 2px;
    }
    #logo-name {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text);
      max-width: 150px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-remove-logo {
      background: rgba(239, 68, 68, 0.1);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.2);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-remove-logo:hover {
      background: var(--danger);
      color: #fff;
    }

    /* Sağ Panel - Önizleme */
    .preview-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      position: sticky;
      top: 2rem;
      height: fit-content;
    }

    .qr-wrapper {
      background: #ffffff;
      padding: 1.25rem;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 280px;
      aspect-ratio: 1;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      width: 100%;
      max-width: 280px;
    }

    .btn-download {
      width: 100%;
      padding: 1rem;
      border-radius: 12px;
      border: none;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }

    .btn-main {
      background: var(--primary);
      color: #090d16;
    }
    .btn-main:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
    }

    .btn-sub {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-sub:hover {
      background: rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-group">
      <h1>ZeroQR Studio</h1>
      <p>Sunucusuz, aboneliksiz, marka logolu vektörel QR oluşturucu.</p>
    </div>

    <!-- Ayar Paneli (Sol) -->
    <div class="form-panel">
      <div class="field-group">
        <label for="qr-data">İçerik (URL veya Metin)</label>
        <input type="text" id="qr-data" value="https://github.com" placeholder="https://...">
      </div>

      <div class="color-grid">
        <div class="field-group">
          <label>Nokta Rengi</label>
          <div class="color-input-wrapper">
            <input type="color" id="dot-color" value="#0f172a">
            <span style="font-size: 0.9rem; font-family: monospace;" id="dot-color-label">#0F172A</span>
          </div>
        </div>
        <div class="field-group">
          <label>Arka Plan</label>
          <div class="color-input-wrapper">
            <input type="color" id="bg-color" value="#ffffff">
            <span style="font-size: 0.9rem; font-family: monospace;" id="bg-color-label">#FFFFFF</span>
          </div>
        </div>
      </div>

      <div class="grid-2col" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem;">
        <div class="field-group">
          <label for="dot-style">Nokta Deseni</label>
          <select id="dot-style">
            <option value="rounded">Yuvarlatılmış</option>
            <option value="classy-rounded">Zarif Yuvarlak</option>
            <option value="dots">Nokta (Dots)</option>
            <option value="square">Klasik Kare</option>
          </select>
        </div>
        <div class="field-group">
          <label for="corner-style">Köşe Deseni</label>
          <select id="corner-style">
            <option value="extra-rounded">Tam Oval</option>
            <option value="rounded">Hafif Yuvarlak</option>
            <option value="square">Keskin Kare</option>
          </select>
        </div>
      </div>

      <!-- YENİLENMİŞ: Logo Bölümü -->
      <div class="field-group">
        <label>Marka Logosu</label>
        
        <!-- Yükleme Alanı (Sürükle bırak + Tıkla) -->
        <div class="logo-upload-area" id="logo-drop-zone">
          <input type="file" id="logo-input" accept="image/png, image/jpeg, image/svg+xml">
          <div class="upload-prompt">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 16V8M12 8L9 11M12 8L15 11" />
              <path d="M19.33 11C19.86 11.49 20.21 12.11 20.31 12.8C20.4 13.48 20.25 14.18 19.88 14.77C19.51 15.36 18.94 15.8 18.28 16M18.28 16C17.62 16.2 16.92 16.14 16.31 15.82C15.7 15.5 15.22 14.96 14.93 14.3M18.28 16V18C18.28 19.1 17.38 20 16.28 20H7.72C6.62 20 5.72 19.1 5.72 18V16M5.72 16C5.06 15.8 4.49 15.36 4.12 14.77C3.75 14.18 3.6 13.48 3.69 12.8C3.79 12.11 4.14 11.49 4.67 11" />
            </svg>
            <span class="upload-text">Logoyu buraya sürükleyin veya tıklayın</span>
            <span class="upload-subtext">PNG, JPG, SVG (Maks. 500KB önerilir)</span>
          </div>
        </div>

        <!-- Önizleme ve Kaldırma Barı (Varsayılan gizli) -->
        <div class="logo-preview-wrapper" id="logo-preview-bar">
          <div class="logo-meta">
            <img src="" id="logo-preview-img" alt="Logo Önizleme">
            <span id="logo-name">logo.png</span>
          </div>
          <button class="btn-remove-logo" id="btn-remove-logo" type="button">Logoyu Kaldır</button>
        </div>
      </div>
    </div>

    <!-- Önizleme Paneli (Sağ) -->
    <div class="preview-panel">
      <div class="qr-wrapper">
        <div id="qr-canvas"></div>
      </div>

      <div class="actions">
        <button class="btn-download btn-main" onclick="downloadQR('png')">PNG Olarak İndir (Web)</button>
        <button class="btn-download btn-sub" onclick="downloadQR('svg')">SVG Olarak İndir (Baskı)</button>
      </div>
    </div>
  </div>

  <script>
    // QR Kodu Çekirdek Ayarları
    const qrCode = new QRCodeStyling({
      width: 250,
      height: 250,
      type: "svg", // Vektörel çizim
      data: "https://github.com",
      dotsOptions: { color: "#0f172a", type: "rounded" },
      cornersSquareOptions: { type: "extra-rounded" },
      backgroundOptions: { color: "#ffffff" },
      imageOptions: {
        crossOrigin: "anonymous",
        margin: 5, // Logonun etrafındaki temiz alan
        imageSize: 0.35 // Logonun QR içindeki büyüklük oranı
      }
    });

    qrCode.append(document.getElementById("qr-canvas"));

    // DOM Elementleri
    const inputData = document.getElementById("qr-data");
    const inputDotColor = document.getElementById("dot-color");
    const inputBgColor = document.getElementById("bg-color");
    const selectDotStyle = document.getElementById("dot-style");
    const selectCornerStyle = document.getElementById("corner-style");
    
    // Logo Elementleri
    const logoInput = document.getElementById("logo-input");
    const logoDropZone = document.getElementById("logo-drop-zone");
    const logoPreviewBar = document.getElementById("logo-preview-bar");
    const logoPreviewImg = document.getElementById("logo-preview-img");
    const logoNameSpan = document.getElementById("logo-name");
    const btnRemoveLogo = document.getElementById("btn-remove-logo");

    // Canlı Güncelleme Fonksiyonları
    inputData.addEventListener("input", (e) => qrCode.update({ data: e.target.value || " " }));
    
    inputDotColor.addEventListener("input", (e) => {
      document.getElementById("dot-color-label").innerText = e.target.value.toUpperCase();
      qrCode.update({ dotsOptions: { color: e.target.value } });
    });

    inputBgColor.addEventListener("input", (e) => {
      document.getElementById("bg-color-label").innerText = e.target.value.toUpperCase();
      qrCode.update({ backgroundOptions: { color: e.target.value } });
    });

    selectDotStyle.addEventListener("change", (e) => qrCode.update({ dotsOptions: { type: e.target.value } }));
    selectCornerStyle.addEventListener("change", (e) => qrCode.update({ cornersSquareOptions: { type: e.target.value } }));

    // --- YENİ: Gelişmiş Logo Yönetim Mantığı ---

    // 1. Dosya Seçme ve Önizleme
    const handleLogoChange = (file) => {
      if (!file) return;

      // Dosya tipi kontrolü
      if (!file.type.startsWith('image/')) {
        alert("Lütfen geçerli bir resim dosyası (PNG, JPG, SVG) seçin.");
        return;
      }

      const reader = new FileReader();
      reader.onload = (e) => {
        const base64Image = e.target.result;
        
        // QR Kodunu logoyla güncelle
        qrCode.update({ image: base64Image });

        // Arayüzü güncelle: Yükleme alanını gizle, önizleme barını göster
        logoPreviewImg.src = base64Image;
        logoNameSpan.innerText = file.name;
        logoDropZone.style.display = "none";
        logoPreviewBar.classList.add("active");
      };
      reader.readAsDataURL(file);
    };

    // Input değiştiğinde
    logoInput.addEventListener("change", (e) => handleLogoChange(e.target.files[0]));

    // 2. Sürükle-Bırak Efektleri
    logoDropZone.addEventListener("dragover", (e) => {
      e.preventDefault();
      logoDropZone.classList.add("drag-over");
    });

    logoDropZone.addEventListener("dragleave", () => {
      logoDropZone.classList.remove("drag-over");
    });

    logoDropZone.addEventListener("drop", (e) => {
      e.preventDefault();
      logoDropZone.classList.remove("drag-over");
      handleLogoChange(e.dataTransfer.files[0]);
    });

    // 3. LOGO KALDIRMA
    btnRemoveLogo.addEventListener("click", () => {
      // QR Kodundan logoyu sil
      qrCode.update({ image: "" });

      // Inputu sıfırla (aynı dosya tekrar seçilebilsin diye)
      logoInput.value = "";
      
      // Arayüzü eski haline getir
      logoDropZone.style.display = "block";
      logoPreviewBar.classList.remove("active");
      logoPreviewImg.src = "";
    });

    // İndirme Fonksiyonu
    function downloadQR(format) {
      const fileName = "zero-qr-studio-" + new Date().getTime();
      qrCode.download({ name: fileName, extension: format });
    }
  </script>
</body>
</html>
